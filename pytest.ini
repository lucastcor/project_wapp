[pytest]
testpaths = tests
addopts = --strict-markers

markers =
    integration: exige serviço externo real (PostgreSQL e/ou Redis). Rode com
        WAPP_TEST_DATABASE_URL apontando para um PostgreSQL descartável. Sem o
        serviço, estes testes FALHAM em vez de passar silenciosamente — é
        justamente o comportamento que eles precisam provar.
    postgres: exige PostgreSQL real. SQLite não prova fila, SKIP LOCKED nem
        corrida de escrita.
    redis: exige Redis real.
    slow: leva mais de um segundo; excluído da suíte rápida com `-m "not slow"`.

filterwarnings =
    error::DeprecationWarning:app\..*
