name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run lint
        run: ruff check app tests --select F821,F822,F823,E9

      - name: Run targeted type checks
        run: |
          mypy \
            --ignore-missing-imports \
            --follow-imports=silent \
            --disable-error-code=import-untyped \
            app/api/admin_security.py \
            app/api/routes.py \
            app/services/finetuning_service.py \
            app/services/rate_limit_service.py \
            app/services/system_readiness_service.py \
            app/tools/cleanup_operational_data.py \
            app/tools/export_runtime_backup.py \
            app/tools/preflight_check.py \
            app/tools/reminder_worker.py

      - name: Run targeted SAST
        run: |
          bandit -q \
            app/api/admin_security.py \
            app/api/routes.py \
            app/services/finetuning_service.py \
            app/services/rate_limit_service.py \
            app/services/system_readiness_service.py \
            app/tools/cleanup_operational_data.py \
            app/tools/export_runtime_backup.py \
            app/tools/preflight_check.py \
            app/tools/reminder_worker.py

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: pytest tests/ -x -q --tb=short

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wapp-api:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name wapp-smoke -p 8000:8000 \
            -e DATABASE_URL=sqlite:///test.db \
            -e ENVIRONMENT=test \
            wapp-api:${{ github.sha }}
          sleep 5
          curl -sf http://localhost:8000/health || exit 1
          docker stop wapp-smoke
