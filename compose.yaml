services:
  postgres:
    image: postgres:17-alpine
    container_name: project_wapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_wapp}
      POSTGRES_USER: ${POSTGRES_USER:-project_wapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_wapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
    container_name: project_wapp_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://project_wapp:project_wapp@postgres:5432/project_wapp}
      POSTGRES_DATABASE_URL: ${COMPOSE_POSTGRES_DATABASE_URL:-postgresql://project_wapp:project_wapp@postgres:5432/project_wapp}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      OPERATIONS_BACKUP_DIR: ${OPERATIONS_BACKUP_DIR:-/app/backups}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STRICT_RUNTIME_VALIDATION: ${STRICT_RUNTIME_VALIDATION:-true}
      ENABLE_RATE_LIMITING: ${ENABLE_RATE_LIMITING:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-10}
      RATE_LIMIT_ADMIN_REQUESTS: ${RATE_LIMIT_ADMIN_REQUESTS:-180}
      RATE_LIMIT_INCOMING_REQUESTS: ${RATE_LIMIT_INCOMING_REQUESTS:-120}
      RATE_LIMIT_WEBHOOK_REQUESTS: ${RATE_LIMIT_WEBHOOK_REQUESTS:-300}
      RATE_LIMIT_EXEMPT_LOCALHOST: ${RATE_LIMIT_EXEMPT_LOCALHOST:-false}
      ENABLE_ADMIN_AUTH: ${ENABLE_ADMIN_AUTH:-true}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_VIEWER_TOKEN: ${ADMIN_VIEWER_TOKEN:-}
      ADMIN_OPERATOR_TOKEN: ${ADMIN_OPERATOR_TOKEN:-}
      ADMIN_SUPERADMIN_TOKEN: ${ADMIN_SUPERADMIN_TOKEN:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      REMINDER_WORKER_ENABLED: ${REMINDER_WORKER_ENABLED:-true}
      REMINDER_WORKER_POLL_SECONDS: ${REMINDER_WORKER_POLL_SECONDS:-60}
      REMINDER_WORKER_DISPATCH_IMMEDIATELY: ${REMINDER_WORKER_DISPATCH_IMMEDIATELY:-true}
      REMINDER_WORKER_CHANNEL: ${REMINDER_WORKER_CHANNEL:-}
      REMINDER_WORKER_AUDIENCES: ${REMINDER_WORKER_AUDIENCES:-customer,internal}
      APPOINTMENT_QUEUE_AUTO_DISPATCH: ${APPOINTMENT_QUEUE_AUTO_DISPATCH:-true}
      APPOINTMENT_QUEUE_RESPONSE_WINDOW_MINUTES: ${APPOINTMENT_QUEUE_RESPONSE_WINDOW_MINUTES:-30}
      APPOINTMENT_QUEUE_WAIT_FOLLOWUP_MINUTES: ${APPOINTMENT_QUEUE_WAIT_FOLLOWUP_MINUTES:-30}
      ADMIN_APP_API_BASE_URL: ${ADMIN_APP_API_BASE_URL:-http://api:8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_FINETUNED_MODEL: ${OPENAI_FINETUNED_MODEL:-}
      USE_FINETUNED_MODEL_FOR_REPLIES: ${USE_FINETUNED_MODEL_FOR_REPLIES:-false}
      OPENAI_FINETUNING_BASE_MODEL: ${OPENAI_FINETUNING_BASE_MODEL:-gpt-4o-mini-2024-07-18}
      OPENAI_FINETUNING_SUFFIX: ${OPENAI_FINETUNING_SUFFIX:-project-wapp-style}
      ENABLE_FINETUNING_PIPELINE: ${ENABLE_FINETUNING_PIPELINE:-false}
      ALLOW_UNTRUSTED_TENANT_HINTS: ${ALLOW_UNTRUSTED_TENANT_HINTS:-false}
      ALLOW_UNAUTHENTICATED_INGEST: ${ALLOW_UNAUTHENTICATED_INGEST:-false}
      ALLOW_LEGACY_GLOBAL_ADMIN_TOKENS: ${ALLOW_LEGACY_GLOBAL_ADMIN_TOKENS:-false}
      PII_PSEUDONYMIZATION_KEY: ${PII_PSEUDONYMIZATION_KEY:-}
      PII_PSEUDONYMIZATION_KEY_VERSION: ${PII_PSEUDONYMIZATION_KEY_VERSION:-v1}
      IMPORT_MAX_CONTEXT_TURNS: ${IMPORT_MAX_CONTEXT_TURNS:-6}
      IMPORT_MAX_CONTEXT_CHARS: ${IMPORT_MAX_CONTEXT_CHARS:-2000}
      NEAR_DUPLICATE_MAX_DISTANCE: ${NEAR_DUPLICATE_MAX_DISTANCE:-4}
      ENABLE_REAL_MODEL_EVALUATION: ${ENABLE_REAL_MODEL_EVALUATION:-false}
      ALLOW_PROMOTION_GATE_OVERRIDE: ${ALLOW_PROMOTION_GATE_OVERRIDE:-false}
      ALLOW_NORMALIZED_WHATSAPP_WEBHOOK: ${ALLOW_NORMALIZED_WHATSAPP_WEBHOOK:-false}
      SHARED_STATE_BACKEND: ${SHARED_STATE_BACKEND:-memory}
      REDIS_URL: ${REDIS_URL:-}
      KNOWLEDGE_RETRIEVAL_ENABLED: ${KNOWLEDGE_RETRIEVAL_ENABLED:-true}
      KNOWLEDGE_MAX_CHUNKS: ${KNOWLEDGE_MAX_CHUNKS:-6}
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.05}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-none}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      ENABLE_VECTOR_SEARCH: ${ENABLE_VECTOR_SEARCH:-false}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-5242880}
      IMPORT_MAX_MESSAGES_PER_BATCH: ${IMPORT_MAX_MESSAGES_PER_BATCH:-20000}
      IMPORT_SESSION_GAP_MINUTES: ${IMPORT_SESSION_GAP_MINUTES:-360}
      FINETUNING_MIN_EXAMPLES: ${FINETUNING_MIN_EXAMPLES:-50}
      FINETUNING_MIN_SCENARIOS: ${FINETUNING_MIN_SCENARIOS:-3}
      FINETUNING_MIN_EXAMPLES_PER_SCENARIO: ${FINETUNING_MIN_EXAMPLES_PER_SCENARIO:-5}
      FINETUNING_MIN_EVAL_PASS_RATE: ${FINETUNING_MIN_EVAL_PASS_RATE:-0.7}
      CLASSIFICATION_PROVIDER: ${CLASSIFICATION_PROVIDER:-openai}
      OUTBOUND_PROVIDER: ${OUTBOUND_PROVIDER:-whatsapp}
      OUTBOUND_DEFAULT_CHANNEL: ${OUTBOUND_DEFAULT_CHANNEL:-whatsapp}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-mock}
      CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-America/Sao_Paulo}
      CALENDAR_DEFAULT_WORKDAY_START: ${CALENDAR_DEFAULT_WORKDAY_START:-09:00}
      CALENDAR_DEFAULT_WORKDAY_END: ${CALENDAR_DEFAULT_WORKDAY_END:-18:00}
      CALENDAR_SLOT_INCREMENT_MINUTES: ${CALENDAR_SLOT_INCREMENT_MINUTES:-30}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      CALDAV_URL: ${CALDAV_URL:-}
      CALDAV_USERNAME: ${CALDAV_USERNAME:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      CALDAV_CALENDAR_NAME: ${CALDAV_CALENDAR_NAME:-}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    volumes:
      - backups_data:/app/backups
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
    container_name: project_wapp_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.tools.reminder_worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      STRICT_RUNTIME_VALIDATION: ${STRICT_RUNTIME_VALIDATION:-true}
      OPERATIONS_BACKUP_DIR: ${OPERATIONS_BACKUP_DIR:-/app/backups}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://project_wapp:project_wapp@postgres:5432/project_wapp}
      POSTGRES_DATABASE_URL: ${COMPOSE_POSTGRES_DATABASE_URL:-postgresql://project_wapp:project_wapp@postgres:5432/project_wapp}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_ADMIN_AUTH: ${ENABLE_ADMIN_AUTH:-true}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_VIEWER_TOKEN: ${ADMIN_VIEWER_TOKEN:-}
      ADMIN_OPERATOR_TOKEN: ${ADMIN_OPERATOR_TOKEN:-}
      ADMIN_SUPERADMIN_TOKEN: ${ADMIN_SUPERADMIN_TOKEN:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLASSIFICATION_PROVIDER: ${CLASSIFICATION_PROVIDER:-openai}
      OUTBOUND_PROVIDER: ${OUTBOUND_PROVIDER:-whatsapp}
      OUTBOUND_DEFAULT_CHANNEL: ${OUTBOUND_DEFAULT_CHANNEL:-whatsapp}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      REMINDER_WORKER_ENABLED: ${REMINDER_WORKER_ENABLED:-true}
      REMINDER_WORKER_POLL_SECONDS: ${REMINDER_WORKER_POLL_SECONDS:-60}
      REMINDER_WORKER_DISPATCH_IMMEDIATELY: ${REMINDER_WORKER_DISPATCH_IMMEDIATELY:-true}
      REMINDER_WORKER_CHANNEL: ${REMINDER_WORKER_CHANNEL:-}
      REMINDER_WORKER_AUDIENCES: ${REMINDER_WORKER_AUDIENCES:-customer,internal}
      APPOINTMENT_QUEUE_AUTO_DISPATCH: ${APPOINTMENT_QUEUE_AUTO_DISPATCH:-true}
      APPOINTMENT_QUEUE_RESPONSE_WINDOW_MINUTES: ${APPOINTMENT_QUEUE_RESPONSE_WINDOW_MINUTES:-30}
      APPOINTMENT_QUEUE_WAIT_FOLLOWUP_MINUTES: ${APPOINTMENT_QUEUE_WAIT_FOLLOWUP_MINUTES:-30}
      AUTOMATION_ENGINE_ENABLED: ${AUTOMATION_ENGINE_ENABLED:-false}
    volumes:
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD", "python", "-m", "app.tools.reminder_worker", "--validate-only"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  automation-worker:
    build:
      context: .
    container_name: project_wapp_automation_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Processo separado do worker de lembretes de propósito: são filas
    # diferentes, com cadências e falhas independentes. Uma automação lenta
    # não deve atrasar um lembrete.
    command: ["python", "-m", "app.tools.automation_worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      STRICT_RUNTIME_VALIDATION: ${STRICT_RUNTIME_VALIDATION:-true}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://project_wapp:project_wapp@postgres:5432/project_wapp}
      POSTGRES_DATABASE_URL: ${COMPOSE_POSTGRES_DATABASE_URL:-postgresql://project_wapp:project_wapp@postgres:5432/project_wapp}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLASSIFICATION_PROVIDER: ${CLASSIFICATION_PROVIDER:-openai}
      OUTBOUND_PROVIDER: ${OUTBOUND_PROVIDER:-whatsapp}
      SHARED_STATE_BACKEND: ${SHARED_STATE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Desligado por padrão: subir o serviço não liga automação.
      AUTOMATION_ENGINE_ENABLED: ${AUTOMATION_ENGINE_ENABLED:-false}
      AUTOMATION_WORKER_ENABLED: ${AUTOMATION_WORKER_ENABLED:-false}
      AUTOMATION_MAX_STEPS_PER_EXECUTION: ${AUTOMATION_MAX_STEPS_PER_EXECUTION:-50}
      AUTOMATION_MAX_ATTEMPTS: ${AUTOMATION_MAX_ATTEMPTS:-5}
      AUTOMATION_JOB_LEASE_SECONDS: ${AUTOMATION_JOB_LEASE_SECONDS:-60}
      AUTOMATION_GATE_LEASE_SECONDS: ${AUTOMATION_GATE_LEASE_SECONDS:-300}
      AUTOMATION_RETRY_BASE_SECONDS: ${AUTOMATION_RETRY_BASE_SECONDS:-10}
      AUTOMATION_RETRY_MAX_SECONDS: ${AUTOMATION_RETRY_MAX_SECONDS:-3600}
      AUTOMATION_WORKER_POLL_SECONDS: ${AUTOMATION_WORKER_POLL_SECONDS:-2.0}
      AUTOMATION_EXECUTION_RETENTION_DAYS: ${AUTOMATION_EXECUTION_RETENTION_DAYS:-90}
      AUTOMATION_MAX_EVENT_BYTES: ${AUTOMATION_MAX_EVENT_BYTES:-16000}
    healthcheck:
      test: ["CMD", "python", "-m", "app.tools.automation_worker", "--validate-only"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: .
    container_name: project_wapp_admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "streamlit",
        "run",
        "app/admin_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    environment:
      ADMIN_APP_API_BASE_URL: ${ADMIN_APP_API_BASE_URL:-http://api:8000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_VIEWER_TOKEN: ${ADMIN_VIEWER_TOKEN:-}
      ADMIN_OPERATOR_TOKEN: ${ADMIN_OPERATOR_TOKEN:-}
      ADMIN_SUPERADMIN_TOKEN: ${ADMIN_SUPERADMIN_TOKEN:-}
      ADMIN_ACTOR: ${ADMIN_ACTOR:-streamlit-admin}
    ports:
      - "${ADMIN_PORT:-8501}:8501"

volumes:
  postgres_data:
  backups_data:
